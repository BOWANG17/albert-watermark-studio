# 自动打包 macOS（Intel + Apple Silicon）与 Windows 版本
# 触发：推送 tag（如 v1.2.1）或手动在 Actions 页面点 "Run workflow"
name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 允许 GITHUB_TOKEN 创建/写入 Release（否则 softprops/action-gh-release 会 403）
permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M 系列) 原生 arm64 —— macos-15 是 arm64 runner
          - os: macos-15
            asset_suffix: "macOS-AppleSilicon"
          # Intel x86_64 —— macos-15-intel 是 Intel runner
          - os: macos-15-intel
            asset_suffix: "macOS-Intel"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyside6 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm build_watermark.spec

      - name: Rename app
        run: |
          mv "dist/Albert水印工坊.app" "dist/Albert水印工坊-${{ matrix.asset_suffix }}.app"

      - name: Create zip (preserve symlinks)
        run: |
          cd dist
          zip -r -y "../Albert水印工坊-${{ matrix.asset_suffix }}.zip" "Albert水印工坊-${{ matrix.asset_suffix }}.app"
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Albert水印工坊-${{ matrix.asset_suffix }}
          path: "Albert水印工坊-${{ matrix.asset_suffix }}.zip"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "Albert水印工坊-${{ matrix.asset_suffix }}.zip"

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyside6 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm build_watermark_win.spec

      - name: Create zip
        shell: powershell
        run: |
          Compress-Archive -Path "dist/Albert水印工坊/*" -DestinationPath "Albert水印工坊-Windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Albert水印工坊-Windows-x64
          path: "Albert水印工坊-Windows-x64.zip"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "Albert水印工坊-Windows-x64.zip"
